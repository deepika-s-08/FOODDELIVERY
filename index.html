
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodieGo - Food Delivery</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="login-box">
            <h1>🍔 FoodieGo</h1>
            <p>Login to order your favourite food</p>

            <input type="text" id="loginId"
                   placeholder="Enter Login ID">

            <input type="password" id="loginPassword"
                   placeholder="Enter Password">

            <button onclick="login()">Login</button>

            <p id="loginError"></p>
        </div>
    </div>

    <!-- MAIN WEBSITE -->
    <div id="mainPage">

        <!-- HEADER -->
        <header>
            <h1>🍔 FoodieGo</h1>

            <div class="header-buttons">
                <button class="cart-btn" onclick="showCart()">
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>

                <button class="logout-btn" onclick="logout()">
                    Logout
                </button>
            </div>
        </header>

        <!-- HERO SECTION -->
        <section class="hero">
            <h2>Delicious Food, Delivered Fast!</h2>
            <p>Search and order your favourite food</p>

            <input type="text" class="search-box"
                   id="searchBox"
                   placeholder="🔍 Search food..."
                   onkeyup="searchFood()">
        </section>

        <!-- FOOD LIST -->
        <section class="food-section">
            <h2>🍽️ Available Food</h2>
            <div class="food-container" id="foodList"></div>
        </section>

        <!-- CART -->
        <section class="cart-section" id="cartSection">
            <div class="cart-box">
                <h2>🛒 Your Cart</h2>

                <div id="cartItems">
                    <p>Your cart is empty.</p>
                </div>

                <div class="total">
                    Total: ₹<span id="cartTotal">0</span>
                </div>

                <!-- PAYMENT -->
                <div class="payment">
                    <h3>💳 Select Payment Method</h3>

                    <label>
                        <input type="radio" name="payment"
                               value="UPI" checked>
                        UPI
                    </label>

                    <label>
                        <input type="radio" name="payment"
                               value="Credit/Debit Card">
                        Credit / Debit Card
                    </label>

                    <label>
                        <input type="radio" name="payment"
                               value="Net Banking">
                        Net Banking
                    </label>

                    <label>
                        <input type="radio" name="payment"
                               value="Cash on Delivery">
                        Cash on Delivery
                    </label>

                    <button class="order-btn"
                            onclick="placeOrder()">
                        Confirm Order
                    </button>
                </div>
            </div>
        </section>

        <!-- FOOTER -->
        <footer>
            © 2026 FoodieGo | Online Food Delivery
        </footer>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
